<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorib er gari game - Lamborghini Style</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #70a1ff, #e1f5fe);
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            display: none;
        }
        #score-hud {
            position: absolute;
            top: 20px;
            right: 25px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffff00;
            padding: 10px 20px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid #ffff00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            display: none;
            z-index: 5;
        }
        #position-hud {
            position: absolute;
            top: 20px;
            right: 25px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ff00;
            padding: 10px 20px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid #00ff00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            display: none;
            z-index: 5;
        }
        #phone-controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: none;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 10;
        }
        .touch-group {
            display: flex;
            gap: 20px;
        }
        .phone-btn {
            width: 85px;
            height: 85px;
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid white;
            border-radius: 50%;
            color: white;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            outline: none;
        }
        .phone-btn:active {
            background: rgba(255, 255, 255, 0.6);
            color: black;
            transform: scale(0.95);
        }
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        #difficulty-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 25;
        }
        h1 {
            color: white;
            font-size: 45px;
            margin-bottom: 5px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            text-align: center;
        }
        .dev-credit {
            color: #aaaaaa;
            font-size: 16px;
            margin-bottom: 30px;
            font-style: italic;
        }
        .btn {
            background-color: #ff3333;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn:hover {
            background-color: #ff5555;
            transform: scale(1.05);
        }
        #scoreboard {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 30;
        }
    </style>
</head>
<body>
    <!-- Main Menu Screen -->
    <div id="menu">
        <h1>Gorib er gari game</h1>
        <div class="dev-credit">(Developed by Zaber Ahmed)</div>
        <button class="btn" onclick="startGame('free')">Free Mode</button>
        <button class="btn" style="background-color: #00aa55;" onclick="startGame('phone')">Phone Version (Touch)</button>
        <button class="btn" onclick="showDifficultyMenu()">Race Mode (10 Cars, 10km)</button>
    </div>

    <!-- Difficulty Selection Screen -->
    <div id="difficulty-menu">
        <h1>SELECT DIFFICULTY</h1>
        <button class="btn" style="background-color: #00cc44;" onclick="startRaceWithDifficulty('easy')">Easy</button>
        <button class="btn" style="background-color: #ffcc00; color: black;" onclick="startRaceWithDifficulty('normal')">Normal</button>
        <button class="btn" style="background-color: #ff3333;" onclick="startRaceWithDifficulty('hard')">Hard</button>
        <button class="btn" style="background-color: #555555; margin-top: 20px;" onclick="backToMainMenu()">Back</button>
    </div>

    <!-- HUD / UI during game -->
    <div id="ui">Use W/S to Drive | Mouse Drag = 360° Camera | <span id="info"></span></div>
    <div id="score-hud">Score: <span id="scoreVal">0</span> | Best: <span id="highScoreVal">0</span></div>
    <div id="position-hud">Position: <span id="posNum">1</span>/10</div>

    <!-- Phone Version Touch Controls -->
    <div id="phone-controls">
        <div class="touch-group">
            <button class="phone-btn" id="pLeft">◀</button>
            <button class="phone-btn" id="pRight">▶</button>
        </div>
        <div class="touch-group" style="gap: 10px;">
            <button class="phone-btn" id="pBrake" style="background: rgba(200, 0, 0, 0.5);">▼</button>
            <button class="phone-btn" id="pSpeed" style="background: rgba(0, 200, 0, 0.5);">▲</button>
        </div>
    </div>

    <!-- Scoreboard / Finish Screen -->
    <div id="scoreboard">
        <h2 id="scoreTitle" style="color: #ff3333; font-size: 35px;">Game Over!</h2>
        <p id="rankResult" style="font-size: 24px; margin: 20px 0;"></p>
        <button class="btn" onclick="location.reload()">Play Again</button>
    </div>

    <!-- Three.js Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Audio API Setup ---
        let audioCtx = null;
        let engineOsc = null;
        let engineGain = null;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function startEngineSound() {
            if (engineOsc) return;
            try {
                engineOsc = audioCtx.createOscillator();
                engineGain = audioCtx.createGain();
                engineOsc.type = 'sawtooth';
                engineOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
                let filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(300, audioCtx.currentTime);
                engineGain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                engineOsc.connect(filter);
                filter.connect(engineGain);
                engineGain.connect(audioCtx.destination);
                engineOsc.start();
            } catch (e) {}
        }

        function updateEngineSound(speed) {
            if (engineOsc && audioCtx) {
                let targetFreq = 55 + Math.abs(speed) * 110;
                engineOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
            }
        }

        function playBlastSound() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.8);

                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch(e) {}
        }

        function startBGM() {
            if (bgmInterval) return;
            const melody = [329.63, 392.00, 440.00, 523.25, 493.88, 440.00, 392.00, 329.63]; 
            let step = 0;
            bgmInterval = setInterval(() => {
                if (!audioCtx) return;
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(melody[step], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.018, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                    step = (step + 1) % melody.length;
                } catch(e) {}
            }, 250);
        }
        // ---------------------------------

        let gameMode = null;
        let difficulty = 'normal';
        let gameActive = false;

        let currentScore = 0;
        let highScore = localStorage.getItem('gorib_gari_highscore') || 0;
        let gameStartTime = 0;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.0015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        sunLight.position.set(80, 150, 50);
        scene.add(sunLight);

        const trackLength = 10000;

        // --- NYC Style Asphalt Road ---
        const roadGeometry = new THREE.PlaneGeometry(14, trackLength + 2000);
        const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        const road = new THREE.Mesh(roadGeometry, roadMaterial);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -trackLength / 2;
        scene.add(road);

        // --- Concrete Sidewalks ---
        const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.9 });
        const leftSidewalk = new THREE.Mesh(new THREE.PlaneGeometry(4, trackLength + 2000), sidewalkMat);
        leftSidewalk.rotation.x = -Math.PI / 2;
        leftSidewalk.position.set(-9, 0.02, -trackLength / 2);
        scene.add(leftSidewalk);

        const rightSidewalk = new THREE.Mesh(new THREE.PlaneGeometry(4, trackLength + 2000), sidewalkMat);
        rightSidewalk.rotation.x = -Math.PI / 2;
        rightSidewalk.position.set(9, 0.02, -trackLength / 2);
        scene.add(rightSidewalk);

        // --- Road Dividers & Crosswalks ---
        const roadLines = [];
        for (let i = 0; i > -trackLength; i -= 12) {
            const line = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.03, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            line.position.set(0, 0.04, i);
            scene.add(line);
            roadLines.push(line);
        }

        for (let i = -50; i > -trackLength; i -= 400) {
            for(let x = -5; x <= 5; x += 2.5) {
                const crossLine = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                crossLine.rotation.x = -Math.PI / 2;
                crossLine.position.set(x, 0.05, i);
                scene.add(crossLine);
            }
        }

        // --- New York Brick Skyscrapers ---
        const buildings = [];
        function createCityBuildings() {
            const brickColors = [0x8b3a2b, 0xa0522d, 0x693527, 0x5c4033, 0x4a4a4a, 0x704241];
            for (let z = 10; z > -trackLength; z -= 40) {
                let heightL = 35 + Math.random() * 60;
                let widthL = 14 + Math.random() * 10;
                let bMatL = new THREE.MeshStandardMaterial({ color: brickColors[Math.floor(Math.random() * brickColors.length)], roughness: 0.7 });
                let bMeshL = new THREE.Mesh(new THREE.BoxGeometry(widthL, heightL, 30), bMatL);
                bMeshL.position.set(-18 - widthL/2, heightL/2, z);
                scene.add(bMeshL);
                buildings.push(bMeshL);

                let heightR = 35 + Math.random() * 60;
                let widthR = 14 + Math.random() * 10;
                let bMatR = new THREE.MeshStandardMaterial({ color: brickColors[Math.floor(Math.random() * brickColors.length)], roughness: 0.7 });
                let bMeshR = new THREE.Mesh(new THREE.BoxGeometry(widthR, heightR, 30), bMatR);
                bMeshR.position.set(18 + widthR/2, heightR/2, z);
                scene.add(bMeshR);
                buildings.push(bMeshR);
            }
        }
        createCityBuildings();

        // --- Lamborghini / Supercar Detailed Model ---
        function createLamborghiniCar(colorHex) {
            const car = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.12, metalness: 0.9 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.05, metalness: 0.95 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.1 });

            // Low-slung sharp wedge body (Lamborghini style)
            const mainBody = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.42, 4.4), bodyMat);
            mainBody.position.y = 0.38;
            car.add(mainBody);

            // Angled aggressive cockpit/cabin
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.45, 1.9), glassMat);
            cabin.position.set(0, 0.72, 0.15);
            cabin.rotation.x = -0.1;
            car.add(cabin);

            // Sloped aggressive front hood
            const frontHood = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.22, 1.5), bodyMat);
            frontHood.position.set(0, 0.48, -1.45);
            frontHood.rotation.x = -0.28;
            car.add(frontHood);

            // Rear spoiler/wing
            const spoilerPillars = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.18, 0.1), darkMat);
            spoilerPillars.position.set(0, 0.65, 2.0);
            car.add(spoilerPillars);

            const spoilerWing = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.06, 0.45), bodyMat);
            spoilerWing.position.set(0, 0.75, 2.0);
            car.add(spoilerWing);

            // Fire / Explosion mesh when crashed
            const fireMesh = new THREE.Mesh(
                new THREE.SphereGeometry(1.4, 8, 8), 
                new THREE.MeshBasicMaterial({ color: 0xff2200, transparent: true, opacity: 0.0 })
            );
            fireMesh.position.set(0, 1.0, 0);
            car.add(fireMesh);
            car.userData.fireMesh = fireMesh;

            // Wheels
            car.userData.wheels = [];
            const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.35, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });

            [[-1.05, 0.38, -1.3], [1.05, 0.38, -1.3], [-1.05, 0.38, 1.3], [1.05, 0.38, 1.3]].forEach(pos => {
                const wheelGroup = new THREE.Group();
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheelGroup.add(wheel);

                const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.37, 8), rimMat);
                rim.rotation.z = Math.PI / 2;
                wheelGroup.add(rim);

                wheelGroup.position.set(pos[0], pos[1], pos[2]);
                car.add(wheelGroup);
                car.userData.wheels.push(wheelGroup);
            });

            return car;
        }

        // --- Player Car (Bright Red Lamborghini) ---
        const playerCar = createLamborghiniCar(0xff0000); // Red color for user car
        playerCar.position.set(0, 0, 0);
        scene.add(playerCar);

        let aiCars = [];
        // 10 Distinct Supercar Colors for 10 Cars
        const supercarColors = [
            0x33cc33, // Green
            0x3333ff, // Blue
            0xff9900, // Orange
            0x9933ff, // Purple
            0x00ffff, // Cyan
            0xff00ff, // Magenta
            0xffff00, // Yellow
            0xff6666, // Pink
            0x00ff88, // Mint
            0xffffff  // White
        ];

        function setupRaceMode() {
            aiCars = [];
            let baseSpeed = difficulty === 'hard' ? 0.95 : (difficulty === 'normal' ? 0.82 : 0.70);

            for (let i = 0; i < 9; i++) {
                const ai = createLamborghiniCar(supercarColors[i % supercarColors.length]);
                const laneX = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 4 + 0.5);
                const zPos = -10 - (i * 8) - Math.random() * 5;
                ai.position.set(laneX, 0, zPos);
                scene.add(ai);
                aiCars.push({ mesh: ai, speed: baseSpeed + Math.random() * 0.2, finished: false, isCrashed: false, crashTimer: 0, originalSpeed: baseSpeed });
            }
        }

        function setupFreeMode() {
            aiCars = [];
            let initialCarCount = 5;
            for (let i = 0; i < initialCarCount; i++) {
                const enemy = createLamborghiniCar(supercarColors[i % supercarColors.length]);
                enemy.position.set((Math.random() > 0.5 ? 1 : -1) * (Math.random() * 3 + 0.5), 0, -50 - (i * 35));
                scene.add(enemy);
                aiCars.push({ mesh: enemy, speed: 0.32, isCrashed: false, crashTimer: 0, originalSpeed: 0.32 });
            }
        }

        function showDifficultyMenu() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('difficulty-menu').style.display = 'flex';
        }

        function backToMainMenu() {
            document.getElementById('difficulty-menu').style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
        }

        function startRaceWithDifficulty(diff) {
            difficulty = diff;
            startGame('race');
        }

        function startGame(mode) {
            initAudio();
            startEngineSound();
            startBGM();

            gameMode = mode;
            currentScore = 0;
            gameStartTime = Date.now();

            document.getElementById('menu').style.display = 'none';
            document.getElementById('difficulty-menu').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            document.getElementById('highScoreVal').innerText = highScore;

            aiCars.forEach(c => scene.remove(c.mesh));

            if (mode === 'free' || mode === 'phone') {
                document.getElementById('score-hud').style.display = 'block';
                document.getElementById('position-hud').style.display = 'none';
                if (mode === 'phone') {
                    document.getElementById('phone-controls').style.display = 'flex';
                }
                setupFreeMode();
            } else if (mode === 'race') {
                document.getElementById('score-hud').style.display = 'none';
                document.getElementById('phone-controls').style.display = 'none';
                document.getElementById('position-hud').style.display = 'block';
                setupRaceMode();
            }
            gameActive = true;
        }

        // Touch Controls
        const phoneStates = { left: false, right: false, speed: false, brake: false };

        function bindPhoneButton(id, stateKey) {
            const btn = document.getElementById(id);
            if (!btn) return;
            ['touchstart', 'mousedown'].forEach(evt => btn.addEventListener(evt, (e) => { e.preventDefault(); phoneStates[stateKey] = true; }));
            ['touchend', 'mouseup'].forEach(evt => btn.addEventListener(evt, (e) => { e.preventDefault(); phoneStates[stateKey] = false; }));
        }

        bindPhoneButton('pLeft', 'left');
        bindPhoneButton('pRight', 'right');
        bindPhoneButton('pSpeed', 'speed');
        bindPhoneButton('pBrake', 'brake');

        // Camera Controls
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let cameraAngleX = 0;
        let cameraAngleY = 0.3;
        let cameraDistance = 7;

        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            isMouseDown = true;
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => { isMouseDown = false; });

        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown || !gameActive) return;
            let deltaX = e.clientX - mouseX;
            let deltaY = e.clientY - mouseY;
            mouseX = e.clientX;
            mouseY = e.clientY;

            cameraAngleX -= deltaX * 0.008;
            cameraAngleY = Math.max(0.05, Math.min(1.2, cameraAngleY + deltaY * 0.008));
        });

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        let carSpeed = 0;
        let maxSpeed = 1.1;
        let maxReverseSpeed = -0.35;
        let raceFinished = false;

        function triggerGameOverScreen(reason) {
            gameActive = false;
            document.getElementById('phone-controls').style.display = 'none';
            document.getElementById('position-hud').style.display = 'none';
            document.getElementById('score-hud').style.display = 'none';

            let finalScore = Math.floor(currentScore);
            let congratsText = "";

            if (gameMode === 'free' || gameMode === 'phone') {
                if (finalScore > highScore) {
                    highScore = finalScore;
                    localStorage.setItem('gorib_gari_highscore', highScore);
                    congratsText = `<br><span style="color: #00ff00; font-size: 28px;">🎉 Congratulations! New Record: ${highScore} points! 🎉</span>`;
                } else {
                    congratsText = `<br>Score: <b>${finalScore}</b> | Best Record: <b>${highScore}</b>`;
                }
            }

            document.getElementById('scoreTitle').innerText = "GAME OVER!";
            document.getElementById('rankResult').innerHTML = `<b>${reason}</b>${congratsText}`;
            document.getElementById('scoreboard').style.display = 'block';
        }

        let lastTrafficSpawnTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            if (!gameActive) {
                renderer.render(scene, camera);
                return;
            }

            let elapsedTimeInSeconds = (Date.now() - gameStartTime) / 1000;
            let difficultyMultiplier = 1 + (elapsedTimeInSeconds / 60) * 0.25;
            let dynamicMaxSpeed = maxSpeed * difficultyMultiplier;

            if (gameMode === 'free' || gameMode === 'phone') {
                currentScore += (1000 / 60) * (carSpeed / maxSpeed);
                document.getElementById('scoreVal').innerText = Math.floor(currentScore);

                if (Date.now() - lastTrafficSpawnTime > 15000 && aiCars.length < 14) {
                    lastTrafficSpawnTime = Date.now();
                    const enemy = createLamborghiniCar(supercarColors[Math.floor(Math.random() * supercarColors.length)]);
                    enemy.position.set((Math.random() > 0.5 ? 1 : -1) * (Math.random() * 3 + 0.5), 0, playerCar.position.z - 120 - Math.random() * 50);
                    scene.add(enemy);
                    aiCars.push({ mesh: enemy, speed: 0.32 * difficultyMultiplier, isCrashed: false, crashTimer: 0, originalSpeed: 0.32 * difficultyMultiplier });
                }
            }

            if (keys['ArrowUp'] || keys['w'] || keys['W'] || phoneStates.speed) {
                carSpeed = Math.min(carSpeed + 0.02, dynamicMaxSpeed);
            } else if (keys['ArrowDown'] || keys['s'] || keys['S'] || phoneStates.brake) {
                if (carSpeed > 0) {
                    carSpeed -= 0.04;
                    if (carSpeed < 0) carSpeed = 0;
                } else {
                    carSpeed = Math.max(carSpeed - 0.02, maxReverseSpeed);
                }
            } else {
                carSpeed *= 0.94;
            }

            let steeringSpeed = 0.18;
            if (keys['ArrowLeft'] || keys['a'] || keys['A'] || phoneStates.left) playerCar.position.x -= steeringSpeed;
            if (keys['ArrowRight'] || keys['d'] || keys['D'] || phoneStates.right) playerCar.position.x += steeringSpeed;

            updateEngineSound(carSpeed);

            let roadWidthLimit = 5.2;
            if (playerCar.position.x < -roadWidthLimit) playerCar.position.x = -roadWidthLimit;
            if (playerCar.position.x > roadWidthLimit) playerCar.position.x = roadWidthLimit;

            playerCar.position.z -= carSpeed;

            if (playerCar.userData.wheels && carSpeed !== 0) {
                playerCar.userData.wheels.forEach(wheel => {
                    wheel.rotation.x -= carSpeed * 0.8;
                });
            }

            let distanceCovered = Math.abs(playerCar.position.z);
            let kmRemaining = Math.max(0, (10 - (distanceCovered / 1000))).toFixed(1);

            if (gameMode === 'race') {
                document.getElementById('info').innerText = `Difficulty: ${difficulty.toUpperCase()} | Distance: ${kmRemaining} km`;
                let standings = [{ name: 'Player', z: playerCar.position.z }];
                aiCars.forEach((ai, idx) => standings.push({ name: `Computer ${idx + 1}`, z: ai.mesh.position.z }));
                standings.sort((a, b) => a.z - b.z);
                document.getElementById('posNum').innerText = standings.findIndex(item => item.name === 'Player') + 1;
            } else if (gameMode === 'phone') {
                document.getElementById('info').innerText = `Phone Touch Version (Lamborghini Style)`;
            } else {
                document.getElementById('info').innerText = `Free Mode Driving (Lamborghini Style)`;
            }

            let targetX = playerCar.position.x;
            let targetY = playerCar.position.y + 1.2;
            let targetZ = playerCar.position.z;

            camera.position.x = targetX + Math.sin(cameraAngleX) * cameraDistance * Math.cos(cameraAngleY);
            camera.position.y = targetY + Math.sin(cameraAngleY) * cameraDistance + 1;
            camera.position.z = targetZ + Math.cos(cameraAngleX) * cameraDistance * Math.cos(cameraAngleY);
            camera.lookAt(targetX, targetY, targetZ);

            aiCars.forEach((ai) => {
                if (!ai.finished) {
                    if (!ai.isCrashed) {
                        ai.mesh.position.z -= (ai.originalSpeed * difficultyMultiplier);
                    } else {
                        ai.crashTimer--;
                        ai.speed = 0;
                        if (ai.mesh.userData.fireMesh) {
                            ai.mesh.userData.fireMesh.material.opacity = 0.7 + Math.sin(Date.now() * 0.03) * 0.3;
                        }
                    }

                    if (ai.mesh.userData.wheels && ai.speed > 0) {
                        ai.mesh.userData.wheels.forEach(w => w.rotation.x -= ai.speed * 0.8);
                    }

                    if (gameMode === 'race' && !ai.isCrashed && Math.abs(ai.mesh.position.z - playerCar.position.z) < 120) {
                        let trackingFactor = difficulty === 'hard' ? 0.015 : (difficulty === 'normal' ? 0.01 : 0.005);
                        ai.mesh.position.x += (playerCar.position.x - ai.mesh.position.x) * trackingFactor;
                        if (ai.mesh.position.x < -5.2) ai.mesh.position.x = -5.2;
                        if (ai.mesh.position.x > 5.2) ai.mesh.position.x = 5.2;
                    }

                    if (gameMode === 'race' && Math.abs(ai.mesh.position.z) >= trackLength) {
                        ai.finished = true;
                    }
                }

                if (gameMode !== 'race' && ai.mesh.position.z > playerCar.position.z + 15) {
                    ai.mesh.position.z = playerCar.position.z - 250 - Math.random() * 50;
                    ai.mesh.position.x = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 3 + 0.5);
                    ai.isCrashed = false;
                    if (ai.mesh.userData.fireMesh) ai.mesh.userData.fireMesh.material.opacity = 0.0;
                }

                if (playerCar.position.distanceTo(ai.mesh.position) < 2.2) {
                    if (gameMode === 'free' || gameMode === 'phone') {
                        playerCar.userData.fireMesh.material.opacity = 0.9;
                        ai.mesh.userData.fireMesh.material.opacity = 0.9;
                        playBlastSound();
                        triggerGameOverScreen("Cars Crashed & Exploded!");
                    } else if (gameMode === 'race') {
                        if (!ai.isCrashed) {
                            ai.isCrashed = true;
                            ai.crashTimer = 60;
                            playBlastSound();
                            carSpeed *= 0.4;
                        }
                    }
                }
            });

            if (gameMode === 'race') {
                let playerFinished = distanceCovered >= trackLength;
                if ((playerFinished || aiCars.some(a => a.finished)) && !raceFinished) {
                    raceFinished = true;
                    gameActive = false;
                    document.getElementById('position-hud').style.display = 'none';

                    let standings = [{ name: 'Player', z: playerCar.position.z }];
                    aiCars.forEach((ai, idx) => {
                        standings.push({ name: `Computer ${idx + 1}`, z: ai.mesh.position.z });
                    });
                    
                    standings.sort((a, b) => a.z - b.z);

                    let playerRank = standings.findIndex(item => item.name === 'Player') + 1;
                    let rankSuffix = "th";
                    if (playerRank === 1) rankSuffix = "st (Winner!)";
                    else if (playerRank === 2) rankSuffix = "nd";
                    else if (playerRank === 3) rankSuffix = "rd";

                    document.getElementById('scoreTitle').innerText = "Race Finished!";
                    document.getElementById('rankResult').innerHTML = `You finished as: <b>${playerRank}${rankSuffix}</b> out of 10 Cars!`;
                    document.getElementById('scoreboard').style.display = 'block';
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
